services:
  spring-react:
    image: ghcr.io/kimchanbae/spring-react-api:${IMAGE_TAG:-latest}

    ports:
      - "9000:9000"

    restart: unless-stopped

    # Docker 배포 환경변수
    env_file:
      - .env.docker

    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s